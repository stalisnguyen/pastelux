name: Daily digest

on:
  schedule:
    # 23:00 UTC = 06:00 Asia/Ho_Chi_Minh, so it is ready before the working day.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Digest date (YYYY-MM-DD). Defaults to today (UTC).'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build today's digest
        env:
          # Optional. Without it the job still succeeds, publishing headlines
          # and links with no written summaries.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/fetch-news.mjs --date "${{ inputs.date }}"
          else
            node scripts/fetch-news.mjs
          fi

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "pastelux-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/daily
          if git diff --staged --quiet; then
            echo "No new digest content."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploy only when the digest actually produced something new.
  deploy:
    needs: digest
    if: needs.digest.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
