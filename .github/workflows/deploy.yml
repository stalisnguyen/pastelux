name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # so the daily digest job can trigger a deploy after committing

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer one supersede a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip, not the triggering SHA. The daily digest job
      # commits and pushes, then calls this workflow — which inherits the SHA
      # from before that commit, so it would publish yesterday's digest every
      # single morning. A site deploy always wants the current state of main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Precedence: repository variables, then public/CNAME, then the project
      # Pages URL. astro.config.mjs applies the same rule for local builds.
      - name: Resolve site URL
        env:
          VAR_SITE: ${{ vars.SITE_URL }}
          VAR_BASE: ${{ vars.BASE_PATH }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$VAR_SITE" ]; then
            SITE="$VAR_SITE"; BASE="${VAR_BASE:-/}"
          elif [ -s public/CNAME ]; then
            SITE="https://$(tr -d '[:space:]' < public/CNAME)"; BASE="/"
          else
            SITE="https://${OWNER}.github.io"; BASE="/${REPO}"
          fi
          echo "SITE_URL=$SITE" >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Building for $SITE (base $BASE)"

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
