name = "pastelux-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Only the site may call the proxy. Secrets (GROQ_API_KEY or GEMINI_API_KEY,
# and ACCESS_CODE) are set with `npx wrangler secret put …` and never live here.
[vars]
ALLOWED_ORIGINS = "https://pasteluxvn.com,http://localhost:4321,http://localhost:4550"
GEMINI_MODEL = "gemini-flash-latest"
GROQ_MODEL = "qwen/qwen3.8-27b"

# Gemini refuses some regions (Hong Kong, where Vietnamese traffic often lands).
# Run the Worker next to a Google Cloud region in the US instead.
[placement]
region = "gcp:us-central1"
