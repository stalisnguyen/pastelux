name = "pastelux-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Only the site may call the proxy. Secrets (GROQ_API_KEY or GEMINI_API_KEY,
# and ACCESS_CODE) are set with `npx wrangler secret put …` and never live here.
[vars]
ALLOWED_ORIGINS = "https://pasteluxvn.com,http://localhost:4321,http://localhost:4550"
GEMINI_MODEL = "gemini-flash-lite-latest"
GROQ_MODEL = "qwen/qwen3.8-27b"

# Gemini refuses some regions (Hong Kong, where Vietnamese traffic often
# lands). Calls to Google go through a Durable Object pinned to the US
# (created once with locationHint "enam"), so they always leave from there.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "GeminiRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiRelay"]
